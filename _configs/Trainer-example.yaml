data:
  csv_file: 'datasets\merged.csv'

training:
  num_epochs: 100
  batch_size: 64
  learning_rate: 0.001
  learning_rate_end: 0.0001
  weight_decay: 0.0005
  momentum: 0.9

model:
  image_size: 352
  use_neutrophil_images: True
  freeze_backbone: False
  use_scheduler: True
  name: 'MultimodalClassifier'
  num_workers: 0
